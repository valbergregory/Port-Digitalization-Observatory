# Configuração geral do projeto
default:
  projeto: "Port Digitalization, Efficiency and Trade Costs"
  artefato: "Brazilian Port Digital Transformation Observatory"
  data_inicio_analise: "2010-01-01"   # início dos microdados do EA/ANTAQ
  data_fim_analise: "2025-12-31"      # revisar após retorno do painel ANTAQ
  granularidade_painel: "porto-mes"
  duckdb_path: "data/processed/observatory.duckdb"
