    - "Portaria SEP nº 48, de 02/04/2013 — Belém, Itaqui, Santana, Santarém, Vila do Conde (ÍNTEGRA OBTIDA do DOU em 07/09/2026)"
    - "Portaria SEP nº 52, de 11/04/2013 — Manaus (ÍNTEGRA OBTIDA do DOU em 07/09/2026)"
    - "Decreto nº 8.257, de 29/05/2014 — NÃO é ato do PSP: regulamenta o AFRMM (sistema Mercante, digitalização da cobrança do frete); mantido no dossiê como contexto e possível intervenção separada (categoria janela de comércio exterior)"
    - "Portaria SEP nº 106, de 14/06/2011 — obrigatoriedade em Santos (íntegra pendente: DOU pré-2013 não indexado no in.gov.br; requer OCR da edição em PDF)"
    - "Portarias SEP 142, 162, 163, 202, 231 e 240/2012 — ÍNTEGRAS OBTIDAS na varredura do DOU legado (10/09/2026); ver data/metadata/psp_portarias_dou.csv"
  limitacao_dou: "busca textual do in.gov.br cobre apenas 2013+; edições anteriores exigem o visualizador legado (PDF nativo por página): python/scan_dou_legacy.py"
  documentos_locais:
    - "data/documents/interventions/PSP/ENAP_Projeto_Porto_Sem_Papel.pdf (estudo de caso oficial SEP/ENAP: DUV, Concentrador, Sinaleiro, fases 1-2, custos PAC R$ 405,3 mi; gráficos oficiais de queda de ~8h no tempo médio de espera em Santos 2010→2012)"
  validar_com: ["portarias SEP/DOU por porto", "relatórios de gestão SEP/SERPRO", "evidência operacional (queda de DUVs em papel)"]
  status_registro: "VALIDADA: 23 portos datados (20 com íntegra do DOU = confiança alta; Santos/Rio/Vitória 2011 em confiança média); 13 públicos ainda sem íntegra — varredura 2011 e jan-mar/2013 em curso"

