# Registro PRELIMINAR de intervenções digitais — 2026-09-03
# Regras de datação e níveis de confiança: docs/intervention_registry_protocol.md
# ATENÇÃO: data de tratamento = entrada em PRODUÇÃO, nunca o anúncio.
# Este arquivo é o rascunho de trabalho; o registro definitivo exigirá validação
# ato a ato (DOU, portarias, notas oficiais) antes de entrar no modelo principal.

- id: PSP
  nome: "Porto Sem Papel (Concentrador de Dados Portuários / DUV)"
  categoria: "janela única marítima (maritime single window)"
  responsavel: "SEP/PR (depois SNP/MInfra), desenvolvido pelo SERPRO"
  organizacoes_integradas: ["Autoridade Portuária", "ANVISA", "Polícia Federal", "Vigiagro/MAPA", "Marinha", "Receita Federal"]
  funcionalidades: "DUV substitui ~140 formulários e ~1.000 itens redundantes; anuência eletrônica de estadia da embarcação"
  processos_afetados: ["autorização de atracação", "estadia", "liberação da embarcação"]
  abrangencia: "34-35 portos públicos (obrigatório); TUPs em fase posterior"
  adocao_escalonada: true
  datas_producao:                      # nível porto — coortes documentadas
    - {porto: "Santos",         data: "2011-08-01", confianca: media,
       fonte: "SERPRO (notícia oficial); Portos e Navios",
       obrigatoriedade: "Portaria SEP nº 106, de 14/06/2011 — uso obrigatório do sistema em Santos (teor corroborado por SERPRO e Portogente; íntegra do DOU pendente)"}
    - {porto: "Rio de Janeiro", data: "2011-08-15", confianca: media, fonte: "SERPRO (notícia oficial)"}
    - {porto: "Vitória",        data: "2011-07-13", data_migracao_definitiva: "2011-09-01", confianca: alta,
       fonte: "Portaria SEP nº 135, de 13/07/2011 (DOU 14/07/2011, p. 2) — íntegra obtida; SERPRO noticiou produção em 10/09/2011"}
    # ---- coorte 2012: íntegras obtidas na varredura do DOU legado (2026-09-10) ----
    - {porto: "Fortaleza e Terminal Portuário de Pecém", data: "2012-04-30", data_migracao_definitiva: "2012-05-10", confianca: alta,
       fonte: "Portaria SEP nº 142, de 30/04/2012 (DOU 02/05/2012, p. 8-9) — íntegra em data/documents/interventions/PSP/dou/legacy_scan/"}
    - {porto: "Recife e Suape", data: "2012-06-14", data_migracao_definitiva: "2012-07-03", confianca: alta,
       fonte: "Portaria SEP nº 162, de 14/06/2012 (DOU 15/06/2012, p. 10)"}
    - {porto: "Cabedelo", data: "2012-06-14", data_migracao_definitiva: "2012-08-01", confianca: alta,
       fonte: "Portaria SEP nº 163, de 14/06/2012 (DOU 15/06/2012, p. 10)"}
    - {porto: "Natal, Areia Branca e Maceió", data: "2012-08-08", data_migracao_definitiva: "2012-08-28", confianca: alta,
       fonte: "Portaria SEP nº 202, de 08/08/2012 (DOU 09/08/2012, p. 7)"}
    - {porto: "Antonina, Paranaguá e São Sebastião", data: "2012-09-25", confianca: alta,
       fonte: "Portaria SEP nº 231, de 25/09/2012 (DOU 26/09/2012, p. 1); prazo de migração a extrair da página seguinte"}
    - {porto: "Pelotas, Porto Alegre e Rio Grande", data: "2012-10-19", data_migracao_definitiva: "2012-11-27", confianca: alta,
       fonte: "Portaria SEP nº 240, de 19/10/2012 (DOU 22/10/2012, p. 9)"}
    - {porto: "ainda sem íntegra: Salvador, Aratu, Ilhéus, Itajaí, São Francisco do Sul, Imbituba, Laguna, Niterói, Itaguaí, Angra dos Reis, Forno, Barra do Riacho, Porto Velho",
       data: "a localizar", confianca: baixa, fonte: "varredura 2011 e jan-mar/2013 em curso; registro estruturado em data/metadata/psp_portarias_dou.csv"}
    - {porto: "Belém, Itaqui, Santana (Macapá), Santarém e Vila do Conde",
       data: "2013-04-03", data_migracao_definitiva: "2013-04-23", confianca: alta,
       fonte: "Portaria SEP nº 48, de 02/04/2013 (DOU 03/04/2013, íntegra em data/documents/interventions/PSP/dou/) — uso obrigatório pelos armadores a partir da publicação"}
    - {porto: "Manaus", data: "2013-04-12", data_migracao_definitiva: "2013-05-14", confianca: alta,
       fonte: "Portaria SEP nº 52, de 11/04/2013 (DOU 12/04/2013, íntegra em data/documents/interventions/PSP/dou/)"}
    - {porto: "TUPs (terminais privados)", data: "a validar (2015+)", confianca: baixa, fonte: "Portos e Navios"}
