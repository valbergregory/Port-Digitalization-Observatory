name: tests

on:
  push:
    branches: [main]
    paths: ["python/**", "tests/python/**", "data/metadata/psp_portarias*.csv", "pyproject.toml", ".github/workflows/tests.yml"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/python -q
