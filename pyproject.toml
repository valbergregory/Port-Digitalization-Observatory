[project]
name = "port-digitalization-observatory"
version = "0.0.1"
description = "Auxiliar Python: extração de documentos oficiais, datação de intervenções digitais e (se houver event logs) process mining"
requires-python = ">=3.13"
# Usado de fato (2026-09-12): pypdf (texto das páginas do DOU) e pytest.
# Só acrescentar quando a etapa for ativada:
#   duckdb polars pyarrow  -> processamento massivo de eventos
#   pm4py                  -> process mining (SOMENTE com event logs reais)
dependencies = ["pypdf>=5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
